# Fast checks on every push and pull request: Linux build with system
# packages (shared libraries) and every test, including the Python, Java,
# and C# bindings.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Apache Arrow APT repository, HDF5, GoogleTest)
        run: |
          sudo apt-get update
          sudo apt-get install -y -V ca-certificates lsb-release wget
          wget -q "https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          sudo apt-get install -y -V ./apache-arrow-apt-source-latest-*.deb
          sudo apt-get update
          sudo apt-get install -y -V cmake ninja-build libarrow-dev libparquet-dev \
            libhdf5-dev nlohmann-json3-dev libgtest-dev

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Python packages for the binding tests
        run: python -m pip install numpy pyarrow pandas

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test (C++, C API, Python, Java, C#)
        run: ctest --test-dir build --output-on-failure
